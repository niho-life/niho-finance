# Local PostgreSQL for development. Port 5433 avoids clashing with a PostgreSQL on 5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: niho_finance
      POSTGRES_USER: niho
      POSTGRES_PASSWORD: niho_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niho -d niho_finance"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
